name: Desktop acceptance
run-name: Desktop acceptance at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: python
  UV_PYTHON_DOWNLOADS: never
  MPLBACKEND: Agg

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Read current version without changing it
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          tag="$(python backend/scripts/release_desktop.py validate "$version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check and build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check app scripts tests
          uv run --locked ruff format --check app scripts tests
          uv run --locked python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            target: windows-x86_64
          - os: ubuntu-22.04
            architecture: x64
            target: linux-x86_64
          - os: macos-15
            architecture: arm64
            target: macos-arm64
          - os: macos-15-intel
            architecture: x64
            target: macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
          architecture: ${{ matrix.architecture }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-frontend
          path: frontend/dist
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check native acceptance harness
        working-directory: backend
        run: |
          uv run --locked python -m unittest discover -s tests -p test_desktop_acceptance.py -v
          uv run --locked python -m unittest discover -s tests -p test_gui_portability.py -v
          uv run --locked python -m unittest discover -s tests -p test_desktop_runtime.py -k WebviewURLTests -v
      - name: Install Linux webview test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libasound2
      - name: Log Intel Mac graphics capabilities
        if: matrix.target == 'macos-x86_64'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          for command in (["sysctl", "-n", "hw.model"], ["system_profiler", "SPDisplaysDataType"]):
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=20, check=True)
                  print(f"Graphics diagnostic: {command}\n{result.stdout}", flush=True)
              except (OSError, subprocess.SubprocessError) as error:
                  print(f"Graphics diagnostic unavailable: {error}", flush=True)
          PY
      - name: Build native desktop bundle
        working-directory: backend
        run: uv run --locked --with pyinstaller==6.14.2 python scripts/build_desktop.py
      - name: Create final desktop archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: python backend/scripts/release_desktop.py archive "$RELEASE_VERSION" --target ${{ matrix.target }}
      - name: Verify extracted archive and actual app across normal relaunch
        working-directory: backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Xvfb has no hardware GPU; Chromium blocklists the runner's llvmpipe.
            export LIBGL_ALWAYS_SOFTWARE=true
            # Keep WebGL on llvmpipe, but avoid Qt's unsupported DMA-BUF sharing.
            export QTWEBENGINE_CHROMIUM_FLAGS="--ignore-gpu-blocklist --disable-gpu-compositing"
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" uv run --locked python scripts/smoke_desktop.py ../dist/release --output ../dist/desktop-checks
          else
            uv run --locked python scripts/smoke_desktop.py ../dist/release --output ../dist/desktop-checks
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-${{ matrix.target }}
          path: dist/desktop-checks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
