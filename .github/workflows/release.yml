name: Release UARC
run-name: Release ${{ inputs.version || inputs.bump }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Automatic version increment (ignored when version is supplied)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Optional explicit new version (e.g. 0.2.0); leave empty for automatic"
        required: false
        type: string
      prerelease:
        description: "Mark this development release as a pre-release"
        required: true
        type: boolean
        default: true
      publish_pypi:
        description: "Also publish uarc-simulator to PyPI (Trusted Publisher setup required)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  UV_PYTHON: python
  UV_PYTHON_DOWNLOADS: never
  MPLBACKEND: Agg

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "::error::Select a branch for the release."; exit 1 ;;
          esac
          tag="$(python backend/scripts/release_desktop.py prepare-version --bump "$VERSION_BUMP" --version "$REQUESTED_VERSION")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          count="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length")"
          if [ "$count" != "0" ]; then
            echo "::error::Tag $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Check and build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check app scripts tests
          uv run --locked ruff format --check app scripts tests
          uv run --locked python -m unittest discover -s tests -v
      - name: Build and verify Python distributions
        working-directory: backend
        run: |
          uv run --locked python scripts/build_python.py
          uv run --locked python scripts/smoke_python.py ../dist/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-version-files
          path: |
            backend/pyproject.toml
            backend/uv.lock
            frontend/package.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            target: windows-x86_64
            executable: UARC.exe
          - os: ubuntu-22.04
            architecture: x64
            target: linux-x86_64
            executable: UARC
          - os: macos-15
            architecture: arm64
            target: macos-arm64
            executable: UARC
          - os: macos-15-intel
            architecture: x64
            target: macos-x86_64
            executable: UARC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-version-files
          path: .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
          architecture: ${{ matrix.architecture }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check Windows setup controls
        if: runner.os == 'Windows'
        working-directory: backend
        run: uv run --locked python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Build native desktop bundle
        working-directory: backend
        run: uv run --locked --with pyinstaller==6.14.2 python scripts/build_desktop.py --output ../dist/desktop
      - name: Verify frozen worker and file operations
        working-directory: backend
        run: uv run --locked python scripts/smoke_bundle.py ../dist/desktop/UARC/${{ matrix.executable }}
      - name: Package complete application folder
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: python backend/scripts/release_desktop.py archive "$RELEASE_VERSION" --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-version-files
          path: .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/release
      - name: Require all distributions and create checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: python backend/scripts/release_desktop.py checksums "$RELEASE_VERSION"
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/pyproject.toml backend/uv.lock frontend/package.json
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_TAG"
          fi
          # The release commit adds only verified versions to the dispatched commit.
          # The explicit lease refuses branch movement or deletion since dispatch.
          gh auth setup-git
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"
          release_sha="$(git rev-parse HEAD)"
          # Creating the ref is atomic: an existing tag fails instead of moving.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$release_sha"
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag --title "UARC $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md --draft --prerelease="$PRERELEASE"
          gh release edit "$RELEASE_TAG" --draft=false

  pypi:
    needs: [prepare, publish]
    if: inputs.publish_pypi
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/uarc-simulator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish verified distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
