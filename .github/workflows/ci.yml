name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: python
  UV_PYTHON_DOWNLOADS: never
  MPLBACKEND: Agg

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check app scripts tests
          uv run --locked ruff format --check app scripts tests
          uv run --locked python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Install locked dependencies
        run: |
          uv sync --locked --directory backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Verify generated DTO types
        working-directory: backend
        run: |
          uv run --locked python scripts/export_frontend_types.py
          pnpm --dir ../frontend exec prettier --write src/lib/types.ts
          git ls-files --error-unmatch -- ../frontend/src/lib/types.ts
          git diff --exit-code -- ../frontend/src/lib/types.ts
      - name: Check and build frontend
        run: |
          pnpm --dir frontend format:check
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build
          pnpm --dir frontend exec node scripts/build-workspace-check.mjs ../dist/workspace-check
