[project]
name = "uarc-simulator"
version = "0.1.0"
description = "UARC desktop host and RocketPy simulation engine"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rocket", "simulation", "rocketpy", "desktop"]
authors = [
    { name = "Park Changyeong", email = "amuileum07@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "pywebview[pyside6]>=6.2.1; sys_platform == 'linux'",
    "rasterio==1.4.4",
    "rocketpy==1.13.0",
    "scipy>=1.13.0",
    "tzdata>=2026.6",
]

[project.scripts]
uarc = "app.__main__:main"
uarc-data = "app.cli:main"

[project.urls]
Homepage = "https://github.com/amuileum07/UARC"
Documentation = "https://github.com/amuileum07/UARC/blob/main/docs/PACKAGING.md"
Issues = "https://github.com/amuileum07/UARC/issues"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# These wheels include GDAL/HDF5; source builds need external native libraries.
no-build-package = ["rasterio", "netcdf4"]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Leave whitespace and line wrapping to the formatter.
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff",
]
